<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="1080" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d7dbe0"/></pattern><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6572"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fdecea"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c0392b" stroke-width="3"/></pattern><style>.title{font-size:22px;font-weight:700;fill:#1b2330}.sub{font-size:13px;fill:#5a6572}.h{font-size:16px;font-weight:700;fill:#1b2330}.hw{font-size:16px;font-weight:700;fill:#ffffff}.t{font-size:13px;fill:#1b2330}.tw{font-size:13px;fill:#e8edf3}.s{font-size:12px;fill:#5a6572}.m{font-size:12.5px;font-family:Consolas,Menlo,monospace;fill:#1b2330}.lab{font-size:12px;font-weight:700;fill:#5a6572;letter-spacing:.06em}</style></defs><rect width="1080" height="640" fill="#f5f6f8"/><rect width="1080" height="640" fill="url(#grid)"/><text x="28" y="42" class="title">How the dashboard gets its data</text><text x="28" y="64" class="sub">Everything is collected on the PC. The M5Stack only draws the snapshot it is sent.</text><text x="24" y="100" class="lab" text-anchor="start">ON YOUR PC</text><text x="304" y="100" class="lab" text-anchor="start">BRIDGE</text><text x="584" y="100" class="lab" text-anchor="start">LINK</text><text x="814" y="100" class="lab" text-anchor="start">DEVICE</text><rect x="24" y="112" width="254" height="124" rx="10" fill="#eaf1fb" stroke="#2f6fd6" stroke-width="2"/><text x="38" y="138" class="h">Claude Code login</text><text x="38" y="161" class="t">.credentials.json per config</text><text x="38" y="180" class="t">dir → plan limits endpoint:</text><text x="38" y="199" class="t">session, weekly, per model</text><rect x="24" y="252" width="254" height="124" rx="10" fill="#eaf1fb" stroke="#2f6fd6" stroke-width="2"/><text x="38" y="278" class="h">Claude Code transcripts</text><text x="38" y="301" class="t">~/.claude/projects/**/*.jsonl</text><text x="38" y="320" class="t">→ tokens per day, cache,</text><text x="38" y="339" class="t">models, value at API prices</text><rect x="24" y="392" width="254" height="124" rx="10" fill="#f4ecf7" stroke="#8e44ad" stroke-width="2"/><text x="38" y="418" class="h">Admin API (API orgs)</text><text x="38" y="441" class="t">usage_report + cost_report</text><text x="38" y="460" class="t">→ real spend and tokens</text><text x="38" y="479" class="t">per day for the organization</text><rect x="304" y="112" width="254" height="404" rx="10" fill="#e9f7ef" stroke="#1e8449" stroke-width="2"/><text x="318" y="138" class="h">m5claude-bridge</text><text x="318" y="161" class="t">Python, runs in the background</text><text x="318" y="180" class="t"></text><text x="318" y="199" class="t">Collector</text><text x="318" y="218" class="t">• limits every 5 min, cached</text><text x="330" y="237" class="t">on disk, backs off on 429</text><text x="318" y="256" class="t">• transcripts re-read only</text><text x="330" y="275" class="t">when a file changes</text><text x="318" y="294" class="t"></text><text x="318" y="313" class="t">Snapshot</text><text x="318" y="332" class="t">• one JSON line, ~600 bytes</text><text x="318" y="351" class="t">• includes time + UTC offset</text><text x="318" y="370" class="t"></text><text x="318" y="389" class="t">Hub</text><text x="318" y="408" class="t">• newest snapshot to every</text><text x="330" y="427" class="t">connected device</text><line x1="278" y1="174" x2="302" y2="174" stroke="#5a6572" stroke-width="2" marker-end="url(#ar)"/><line x1="278" y1="314" x2="302" y2="314" stroke="#5a6572" stroke-width="2" marker-end="url(#ar)"/><line x1="278" y1="454" x2="302" y2="454" stroke="#5a6572" stroke-width="2" marker-end="url(#ar)"/><rect x="584" y="112" width="204" height="190" rx="10" fill="#fef5e7" stroke="#d68910" stroke-width="2"/><text x="598" y="138" class="h">USB serial</text><text x="598" y="161" class="t">probes CH9102 / CP2104</text><text x="598" y="180" class="t">ports; keeps one only if</text><text x="598" y="199" class="t">the firmware says hello</text><text x="598" y="218" class="t"></text><text x="598" y="237" class="t">trusted: the cable is</text><text x="598" y="256" class="t">the approval</text><rect x="584" y="326" width="204" height="190" rx="10" fill="#fef5e7" stroke="#d68910" stroke-width="2"/><text x="598" y="352" class="h">Bluetooth LE</text><text x="598" y="375" class="t">scans for the service</text><text x="598" y="394" class="t">UUID, no Windows pairing</text><text x="598" y="413" class="t"></text><text x="598" y="432" class="t">a new PC is approved</text><text x="598" y="451" class="t">once on the device</text><text x="598" y="470" class="t">(C = Allow, A = Deny)</text><line x1="558" y1="207" x2="582" y2="207" stroke="#5a6572" stroke-width="2" marker-end="url(#ar)"/><line x1="558" y1="421" x2="582" y2="421" stroke="#5a6572" stroke-width="2" marker-end="url(#ar)"/><rect x="814" y="112" width="242" height="404" rx="10" fill="#1f2a37" stroke="#111111" stroke-width="2"/><text x="828" y="138" class="hw">M5Stack Basic (ESP32)</text><text x="828" y="161" class="tw">app</text><text x="828" y="180" class="tw">• line parser per link</text><text x="828" y="199" class="tw">• pairing, approved PCs in NVS</text><text x="828" y="218" class="tw">• clock from the snapshot</text><text x="828" y="237" class="tw"></text><text x="828" y="256" class="tw">UI (LovyanGFX)</text><text x="828" y="275" class="tw">• 4 views + settings, EN / ES</text><text x="828" y="294" class="tw">• 4 bands of 320×60, two buffers</text><text x="828" y="313" class="tw"></text><text x="828" y="332" class="tw">board</text><text x="828" y="351" class="tw">• battery: IP5306 over I2C</text><text x="828" y="370" class="tw">• alerts on the speaker (G25)</text><text x="828" y="389" class="tw">• backlight: dim, off on battery</text><text x="828" y="408" class="tw">• SPI DMA → ILI9342C 320×240</text><line x1="788" y1="207" x2="812" y2="207" stroke="#5a6572" stroke-width="2" marker-end="url(#ar)"/><line x1="788" y1="421" x2="812" y2="421" stroke="#5a6572" stroke-width="2" marker-end="url(#ar)"/><rect x="24" y="544" width="1032" height="58" rx="10" fill="#ffffff" stroke="#d7dbe0" stroke-width="1.5"/><text x="42" y="569" class="t" text-anchor="start">The device stores no PC address and no Wi-Fi settings, only the ids of approved PCs.</text><text x="42" y="589" class="s" text-anchor="start">Change computers or networks freely: run the bridge on the new PC and press C once.</text></svg>